name: VTEX Catalogo
on:
  push:
    branches: [main]
    paths:
      - main.py
      - tests/test_vtex_batch.py
      - .github/workflows/vtex.yml
  workflow_dispatch:
    inputs:
      solo_prueba:
        description: "Consultar hasta 100 productos por pais, sin publicar"
        type: boolean
        default: true
  schedule:
    # 5:00 a. m. de El Salvador.
    - cron: "0 11 * * *"
permissions:
  contents: write
concurrency:
  group: vtex-catalogo
  cancel-in-progress: false
jobs:
  catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 250
    env:
      PYTHONUNBUFFERED: "1"
      MAX_WORKERS: "8"
      REQUESTS_PER_SECOND: "8"
      MAX_MINUTES: "220"
      SOLO_PRUEBA: ${{ (github.event_name == 'push' || inputs.solo_prueba == true) && 'true' || 'false' }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: python -m pip install "requests>=2.32,<3"
      - name: Validar sintaxis
        run: python -m py_compile main.py
      - name: Verificar cobertura y procesamiento sin red
        run: python -m unittest discover -s tests -p test_vtex_batch.py -v
      - name: Ejecutar catalogo publico
        id: extraccion
        run: python main.py
      - name: Guardar CSV
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: catalogo_CAM
          path: catalogo_CAM*.csv
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
      - name: Reemplazar CSV del Release latest
        if: ${{ success() && steps.extraccion.outputs.publicar == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: catalogo_CAM.csv
          overwrite_files: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
