name: VTEX Catalogo

on:

  workflow_dispatch:

  schedule:
    - cron: '0 6 * * *'

jobs:

  catalogo:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install requests pandas

      - name: Ejecutar catalogo
        run: |
          python main.py

      - name: Ver tamaño CSV
        run: |
          ls -lh catalogo_CAM.csv

      - name: Guardar CSV
        uses: actions/upload-artifact@v4
        with:
          name: catalogo_CAM
          path: catalogo_CAM.csv
          
      - name: Crear Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: catalogo_CAM.csv
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
