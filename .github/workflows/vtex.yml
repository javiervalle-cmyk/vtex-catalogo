name: VTEX Catalogo

on:
  workflow_dispatch:
    inputs:
      solo_prueba:
        description: "Probar únicamente 3 SKU sin publicar"
        type: boolean
        default: true

      reiniciar:
        description: "Ignorar el avance anterior y comenzar de nuevo"
        type: boolean
        default: false

  schedule:
    # 5:00 a. m. de El Salvador
    - cron: "0 11 * * *"

permissions:
  contents: write

concurrency:
  group: vtex-catalogo
  cancel-in-progress: false

jobs:
  catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: python -m pip install "requests>=2.32,<3"

      - name: Recuperar avance
        if: ${{ inputs.reiniciar != true }}
        uses: actions/cache/restore@v4
        with:
          path: .vtex-state
          key: >-
            ${{ runner.os }}-vtex-siman-v4-${{ hashFiles('main.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-vtex-siman-v4-${{ hashFiles('main.py') }}-

      - name: Ejecutar catalogo
        id: extraccion
        env:
          PYTHONUNBUFFERED: "1"

          VTEX_ACCOUNT: siman
          VTEX_APP_KEY: ${{ secrets.VTEX_APP_KEY }}
          VTEX_APP_TOKEN: ${{ secrets.VTEX_APP_TOKEN }}
          VTEX_SELLER_ID: "1"

          MAX_WORKERS: "2"
          REQUESTS_PER_SECOND: "2"
          MAX_MINUTES: "240"

          SC_SV: "1"
          SC_CR: "2"
          SC_NI: "3"
          SC_GT: "4"

          SOLO_PRUEBA: ${{ inputs.solo_prueba == true && 'true' || 'false' }}

        run: python main.py

      - name: Guardar avance
        if: ${{ always() && hashFiles('.vtex-state/checkpoint.sqlite') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .vtex-state
          key: >-
            ${{ runner.os }}-vtex-siman-v4-${{ hashFiles('main.py') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Guardar CSV de revisión
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalogo_CAM
          path: catalogo_CAM.csv
          if-no-files-found: warn
          retention-days: 7

      - name: Actualizar Release
        if: ${{ success() && steps.extraccion.outputs.publicar == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: catalogo_CAM.csv
          overwrite_files: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
