name: VTEX Catalogo

on:
  workflow_dispatch:

  schedule:
    # 5:00 a. m. de El Salvador = 11:00 UTC
    - cron: "0 11 * * *"

permissions:
  contents: write

concurrency:
  group: vtex-catalogo
  cancel-in-progress: false

jobs:
  catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: python -m pip install requests pandas

      - name: Ejecutar catalogo
        env:
          PYTHONUNBUFFERED: "1"
          VTEX_ACCOUNT: siman
          VTEX_APP_KEY: ${{ secrets.VTEX_APP_KEY }}
          VTEX_APP_TOKEN: ${{ secrets.VTEX_APP_TOKEN }}
          VTEX_SELLER_ID: "1"
          MAX_WORKERS: "6"
          SC_SV: "1"
          SC_CR: "2"
          SC_NI: "3"
          SC_GT: "4"
        run: python main.py

      - name: Ver tamaño CSV
        run: ls -lh catalogo_CAM.csv

      - name: Guardar CSV
        uses: actions/upload-artifact@v4
        with:
          name: catalogo_CAM
          path: catalogo_CAM.csv
          if-no-files-found: error

      - name: Crear Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: catalogo_CAM.csv
          overwrite_files: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
