name: Meta Ads Consolidado

on:
  workflow_dispatch:

  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: write

concurrency:
  group: meta-ads-consolidado
  cancel-in-progress: false

jobs:

  run:

    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar extracción Meta Ads
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: |
          python meta_ads/main.py

      - name: Validar archivos generados
        run: |
          test -f data/meta_ads_consolidada.csv
          test -f data/meta_ads_consolidada.parquet
          ls -lh data/meta_ads_consolidada.*

      - name: Publicar archivos actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/*.csv || true
          git add data/*.parquet || true

          git commit -m "Actualizacion automatica Meta Ads" || exit 0

          git push origin HEAD:main
